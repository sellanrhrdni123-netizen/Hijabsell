                </div>
              ` : `
                <div style="display: flex; align-items: flex-end; gap: 12px; height: 160px; padding-top: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0;">
                  ${dateKeys.map(k => {
                    const val = salesByDate[k];
                    const height = Math.max(15, (val / maxSale) * 100);
                    return `
                      <div style="flex: 1; min-width: 36px; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end;" title="${k}: ${formatRupiah(val)}">
                        <span style="font-size: 9px; color: #888; margin-bottom: 4px; white-space: nowrap;">${formatCompactRupiah(val)}</span>
                        <div style="width: 100%; max-width: 40px; height: ${height}%; background: #8C7A6B; border-radius: 6px 6px 0 0;"></div>
                        <span style="font-size: 10px; color: #777; margin-top: 6px;">${k.slice(5)}</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div>
                  <h3 style="font-size: 15px; font-weight: bold;">Grafik Pertumbuhan Pelanggan</h3>
                  <p style="font-size: 11px; color: #777;">Jumlah pelanggan baru terdaftar</p>
                </div>
                ${custDateKeys.length > 0 ? `<span class="badge badge-info">${totalCustomers} Pelanggan</span>` : ''}
              </div>
              ${custDateKeys.length === 0 ? `
                <div class="empty-state">
                  <div class="empty-icon">👥</div>
                  <h4 style="font-size: 14px; margin-bottom: 4px;">Belum ada data pelanggan</h4>
                  <p style="font-size: 11px; color: #777;">Grafik pertumbuhan akan muncul setelah ada pelanggan baru yang mendaftar atau order.</p>
                </div>
              ` : `
                <div style="display: flex; align-items: flex-end; gap: 12px; height: 160px; padding-top: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0;">
                  ${custDateKeys.map(k => {
                    const count = custGrowthByDate[k];
                    const height = Math.max(20, (count / maxCust) * 100);
                    return `
                      <div style="flex: 1; min-width: 36px; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end;" title="${k}: +${count} pelanggan baru">
                        <span style="font-size: 10px; font-weight: bold; color: #555; margin-bottom: 4px;">+${count}</span>
                        <div style="width: 100%; max-width: 40px; height: ${height}%; background: #332C2B; border-radius: 6px 6px 0 0;"></div>
                        <span style="font-size: 10px; color: #777; margin-top: 6px;">${k.slice(5)}</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>

          <div class="grid grid-2">
            <div class="card">
              <h3 style="font-size: 15px; font-weight: bold; margin-bottom: 4px;">Segmentasi Loyalitas Pelanggan</h3>
              <p style="font-size: 11px; color: #777; margin-bottom: 16px;">Klasifikasi dinamis berdasarkan riwayat transaksi</p>
              ${custs.length === 0 ? `
                <div class="empty-state">
                  <p style="font-size: 12px; color: #777;">Data segmentasi belum tersedia (Belum ada pelanggan).</p>
                </div>
              ` : `
                <div style="display: flex; flex-direction: column; gap: 10px;">
                  ${['VIP Customer', 'Loyal Customer', 'Regular Customer', 'New Customer', 'Inactive Customer'].map(seg => {
                    const count = custs.filter(c => c.segment === seg).length;
                    const pct = totalCustomers > 0 ? Math.round((count / totalCustomers) * 100) : 0;
                    return `
                      <div>
                        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;">
                          <span style="font-weight: 600;">${seg}</span>
                          <span style="color: #777;">${count} orang (${pct}%)</span>
                        </div>
                        <div style="height: 8px; background: #F4EFEB; border-radius: 9999px; overflow: hidden;">
                          <div style="width: ${pct}%; height: 100%; background: #8C7A6B; border-radius: 9999px;"></div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <div class="card">
              <h3 style="font-size: 15px; font-weight: bold; margin-bottom: 4px;">Aktivitas Pelanggan Terbaru</h3>
              <p style="font-size: 11px; color: #777; margin-bottom: 16px;">Catatan otomatis aksi pelanggan & pesanan</p>
              ${acts.length === 0 ? `
                <div class="empty-state">
                  <p style="font-size: 12px; color: #777;">Belum ada aktivitas pelanggan.</p>
                </div>
              ` : `
                <div style="display: flex; flex-direction: column; gap: 12px; max-height: 250px; overflow-y: auto;">
                  ${acts.slice(0, 6).map(act => `
                    <div style="display: flex; gap: 10px; align-items: flex-start; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
                      <span style="font-size: 16px;">🛍️</span>
                      <div style="flex: 1;">
                        <div style="font-weight: 600; font-size: 12px;">${escapeHtml(act.title)}</div>
                        <div style="font-size: 11px; color: #666;">${escapeHtml(act.description)}</div>
                        <span style="font-size: 10px; color: #999;">${formatDate(act.timestamp)}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>

          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <div>
                <h3 style="font-size: 15px; font-weight: bold;">Pesanan Terbaru</h3>
                <p style="font-size: 11px; color: #777;">Daftar transaksi pesanan masuk</p>
              </div>
              <button type="button" class="btn btn-outline" onclick="App.setView('orders')">Lihat Semua Pesanan →</button>
            </div>
            ${orders.length === 0 ? `
              <div class="empty-state">
                <div class="empty-icon">🛍️</div>
                <h4 style="font-size: 14px; margin-bottom: 4px;">Belum ada pesanan</h4>
                <p style="font-size: 11px; color: #777;">Data pesanan akan tampil otomatis di sini setelah ada pesanan masuk.</p>
              </div>
            ` : `
              <div class="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Order ID</th>
                      <th>Pelanggan</th>
                      <th>Tanggal</th>
                      <th>Total</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${orders.slice(0, 5).map(o => `
                      <tr>
                        <td style="font-weight: 600; font-family: monospace;">${escapeHtml(o.id)}</td>
                        <td>${escapeHtml(o.customerName)}</td>
                        <td>${formatDate(o.date)}</td>
                        <td style="font-weight: bold; color: var(--mocha);">${formatRupiah(o.total)}</td>
                        <td><span class="badge badge-success">${escapeHtml(o.orderStatus)}</span></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // --- Customer Database View ---
    function renderCustomers() {
      if (state.selectedCustomerId) {
        return renderCustomerDetail();
      }

      let list = [...(state.data.customers || [])];
      if (state.customerSearch) {
        const q = state.customerSearch.toLowerCase();
        list = list.filter(c => (c.name && c.name.toLowerCase().includes(q)) || (c.email && c.email.toLowerCase().includes(q)) || (c.phone && c.phone.includes(q)));
      }
      if (state.customerFilterSegment === 'REPEAT') {
        const orderCounts = {};
        (state.data.orders || []).forEach(o => { if (o.customerId && o.orderStatus !== 'Cancelled') orderCounts[o.customerId] = (orderCounts[o.customerId] || 0) + 1; });
        list = list.filter(c => (orderCounts[c.id] || 0) >= 2 || (c.segment && c.segment !== 'New Customer' && c.segment !== 'Inactive Customer'));
      } else if (state.customerFilterSegment !== 'ALL') {
        list = list.filter(c => c.segment === state.customerFilterSegment);
      }

      return `
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
              <h3 style="font-size: 16px; font-weight: bold;">Database Pelanggan BY.NVDILA</h3>
              <p style="font-size: 11px; color: #777;">Kelola data kontak, alamat, dan segmentasi loyalitas pelanggan</p>
            </div>
            <button type="button" class="btn btn-primary" onclick="App.openAddCustomer()">+ Tambah Pelanggan</button>
          </div>

          <div class="card" style="padding: 12px; display: flex; gap: 12px; flex-wrap: wrap;">
            <input type="text" id="cust-search" class="form-control" placeholder="Cari nama, email, nomor HP..." value="${escapeHtml(state.customerSearch)}" oninput="App.handleCustSearch(this.value)" style="flex: 1; min-width: 200px;">
            <select id="cust-segment-filter" class="form-control" onchange="App.handleCustSegmentFilter(this.value)" style="width: 180px;">
              <option value="ALL" ${state.customerFilterSegment === 'ALL' ? 'selected' : ''}>Semua Segment</option>
              <option value="REPEAT" ${state.customerFilterSegment === 'REPEAT' ? 'selected' : ''}>Repeat Customers (≥ 2x)</option>
              <option value="VIP Customer" ${state.customerFilterSegment === 'VIP Customer' ? 'selected' : ''}>VIP Customer</option>
              <option value="Loyal Customer" ${state.customerFilterSegment === 'Loyal Customer' ? 'selected' : ''}>Loyal Customer</option>
              <option value="Regular Customer" ${state.customerFilterSegment === 'Regular Customer' ? 'selected' : ''}>Regular Customer</option>
              <option value="New Customer" ${state.customerFilterSegment === 'New Customer' ? 'selected' : ''}>New Customer</option>
              <option value="Inactive Customer" ${state.customerFilterSegment === 'Inactive Customer' ? 'selected' : ''}>Inactive Customer</option>
            </select>
          </div>

          ${list.length === 0 ? `
            <div class="empty-state">
              <div class="empty-icon">👥</div>
              <h4 style="font-size: 14px; margin-bottom: 4px;">Belum ada pelanggan yang cocok</h4>
              <p style="font-size: 11px; color: #777; margin-bottom: 12px;">Mulai bangun database pelanggan hijab BY.NVDILA Anda.</p>
              <button type="button" class="btn btn-primary" onclick="App.openAddCustomer()">+ Tambah Pelanggan</button>
            </div>
          ` : `
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Customer ID</th>
                    <th>Nama Pelanggan</th>
                    <th>No HP / WhatsApp</th>
                    <th>Email</th>
                    <th>Bergabung</th>
                    <th>Segmentasi</th>
                    <th>Total Belanja</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  ${list.map(c => {
                    const custOrders = (state.data.orders || []).filter(o => (o.customerId === c.id || (c.name && o.customerName === c.name)) && o.orderStatus !== 'Cancelled');
                    const totalSpend = custOrders.reduce((s, o) => s + (Number(o.total) || 0), 0);
                    return `
                      <tr>
                        <td style="font-family: monospace; font-weight: 600;">${escapeHtml(c.id)}</td>
                        <td style="font-weight: 600;">
                          <a href="javascript:void(0)" onclick="App.viewCustomer('${c.id}')" style="color: var(--charcoal); text-decoration: underline;">${escapeHtml(c.name)}</a>
                        </td>
                        <td>${escapeHtml(c.phone || '-')}</td>
                        <td>${escapeHtml(c.email || '-')}</td>
                        <td>${formatDate(c.joinDate)}</td>
                        <td><span class="badge badge-${c.segment ? c.segment.toLowerCase().split(' ')[0] : 'new'}">${escapeHtml(c.segment || 'New')}</span></td>
                        <td style="font-weight: bold; color: var(--mocha);">${formatRupiah(totalSpend)} (${custOrders.length} order)</td>
                        <td>
                          <div style="display: flex; gap: 6px;">
                            <button type="button" class="btn btn-outline" style="padding: 4px 8px; font-size: 11px;" onclick="App.viewCustomer('${c.id}')">Detail</button>
                            <button type="button" class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="App.openEditCustomer('${c.id}')">Edit</button>
                            <button type="button" class="btn btn-danger" style="padding: 4px 8px; font-size: 11px;" onclick="App.deleteCustomer('${c.id}')">Hapus</button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    // --- Customer Detail View ---
    /* Detail Pelanggan Lengkap */
    function renderCustomerDetail() {
      const cust = (state.data.customers || []).find(c => c.id === state.selectedCustomerId);
      if (!cust) {
        state.selectedCustomerId = null;
        return renderCustomers();
      }

      const orders = (state.data.orders || []).filter(o => o.customerId === cust.id || (cust.name && o.customerName === cust.name));
      const validOrders = orders.filter(o => o.orderStatus !== 'Cancelled');
      const totalSpent = validOrders.reduce((s, o) => s + (Number(o.total) || 0), 0);
      const lastOrder = [...validOrders].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
      const acts = (state.data.activities || []).filter(a => a.customerId === cust.id || (a.description && a.description.includes(cust.name)));

      return `
        <div style="display: flex; flex-direction: column; gap: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <button type="button" class="btn btn-outline" onclick="App.backToCustomerList()" style="display: inline-flex; align-items: center; gap: 8px; font-weight: 600; padding: 8px 14px; border-radius: 10px;">
              <span style="font-size: 16px; line-height: 1;">←</span> Kembali ke Daftar Pelanggan

    // --- Customer Insight View ---
    function renderInsight() {
      const custs = state.data.customers || [];
      const orders = (state.data.orders || []).filter(o => o.orderStatus !== 'Cancelled');
      const prods = state.data.products || [];

      if (custs.length === 0 || orders.length === 0) {
        return `
          <div class="empty-state" style="padding: 60px 20px;">
            <div class="empty-icon">📈</div>
            <h3 style="font-size: 16px; font-weight: bold; margin-bottom: 4px;">Customer Insight Belum Cukup Data</h3>
            <p style="font-size: 12px; color: #777; max-width: 460px; margin: 0 auto 16px;">
              Insight akan tersedia setelah terdapat data pelanggan dan transaksi nyata di database.
            </p>
            <div style="display: flex; gap: 8px; justify-content: center;">
              <button type="button" class="btn btn-primary" onclick="App.openAddOrder()">+ Input Pesanan Baru</button>
            </div>
          </div>
        `;
      }

      const totalSpent = orders.reduce((s,o) => s + (Number(o.total) || 0), 0);
      const avgSpent = custs.length > 0 ? totalSpent / custs.length : 0;
      const orderCounts = {};
      orders.forEach(o => { if (o.customerId) orderCounts[o.customerId] = (orderCounts[o.customerId] || 0) + 1; });
      const repeatCount = Object.values(orderCounts).filter(c => c >= 2).length;
      const repeatRate = custs.length > 0 ? Math.round((repeatCount / custs.length) * 100) : 0;

      const custSpending = {};
      orders.forEach(o => {
        if (o.customerId) {
          custSpending[o.customerId] = (custSpending[o.customerId] || 0) + (Number(o.total) || 0);
        }
      });
      const topCusts = Object.keys(custSpending).map(id => {
        const c = custs.find(x => x.id === id) || { name: 'Customer ' + id, id };
        return { ...c, total: custSpending[id] };
      }).sort((a,b) => b.total - a.total).slice(0, 5);

      return `
        <div style="display: flex; flex-direction: column; gap: 20px;">
          <div class="grid grid-3">
            <div class="card">
              <span class="form-label">Repeat Purchase Rate</span>
              <div style="font-size: 26px; font-weight: bold; color: #7C3AED; font-family: Georgia, serif;">${repeatRate}%</div>
              <span style="font-size: 11px; color: #777;">${repeatCount} dari ${custs.length} pelanggan</span>
            </div>
            <div class="card">
              <span class="form-label">Rata-rata Belanja (ARPU)</span>
              <div style="font-size: 22px; font-weight: bold; color: var(--mocha); font-family: Georgia, serif;">${formatRupiah(avgSpent)}</div>
              <span style="font-size: 11px; color: #777;">Per pelanggan terdaftar</span>
            </div>
            <div class="card">
              <span class="form-label">Pelanggan Tidak Aktif</span>
              <div style="font-size: 26px; font-weight: bold; color: #DC2626; font-family: Georgia, serif;">${custs.filter(c => c.segment === 'Inactive Customer').length}</div>
              <span style="font-size: 11px; color: #777;">Belum beli &gt; 90 hari</span>
            </div>
          </div>

          <div class="grid grid-2">
            <div class="card">
              <h4 style="font-size: 14px; font-weight: bold; margin-bottom: 12px;">🏆 Top 5 Pelanggan Paling Loyal</h4>
              <div style="display: flex; flex-direction: column; gap: 10px;">
                ${topCusts.map((c, i) => `
                  <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
                    <div>
                      <strong>#${i+1} ${escapeHtml(c.name)}</strong>
                      <div style="font-size: 10px; color: #777;">${escapeHtml(c.id)}</div>
                    </div>
                    <span style="font-weight: bold; color: var(--mocha);">${formatRupiah(c.total)}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="card">
              <h4 style="font-size: 14px; font-weight: bold; margin-bottom: 12px;">🌟 Varian Hijab Terlaris</h4>
              <div style="display: flex; flex-direction: column; gap: 10px;">
                ${prods.slice(0, 5).map(p => `
                  <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
                    <div>
                      <strong>${escapeHtml(p.name)}</strong>
                      <div style="font-size: 10px; color: #777;">${escapeHtml(p.category)}</div>
                    </div>
                    <span class="badge badge-success">Stok: ${p.stock} pcs</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

                      `;
                    }).join('')}

                </table>
              </div>

          </div>

          <!-- Existing Follow-up Reminders -->
          ${followups.length > 0 ? `
            <div id="followup-reminders-section" class="card" style="padding: 16px;">
              <h4 style="font-size: 14px; font-weight: bold; margin-bottom: 12px;">⏰ Jadwal & Catatan Pengingat Follow-up</h4>
              <div class="grid grid-3">
                ${followups.map(f => `
                  <div class="card" style="border: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span class="badge badge-warning">${escapeHtml(f.category)}</span>
                        <span class="badge badge-${f.status === 'Selesai' ? 'success' : 'info'}">${escapeHtml(f.status)}</span>
                      </div>
                      <h4 style="font-size: 13px; font-weight: bold;">${escapeHtml(f.customerName)}</h4>
                      <p style="font-size: 11px; color: #777; font-family: monospace; margin-bottom: 6px;">${escapeHtml(f.customerPhone)}</p>
                      <p style="font-size: 11px; color: #555; background: #FAF8F5; padding: 8px; border-radius: 8px; border: 1px solid var(--border);">"${escapeHtml(f.notes)}"</p>
                    </div>

                        <button type="button" class="btn btn-outline" style="padding: 3px 6px; font-size: 10px;" onclick="App.toggleFollowup('${f.id}')">
                          ${f.status === 'Selesai' ? 'Buka Kembali' : 'Selesai'}
                        </button>
                        <button type="button" class="btn btn-danger" style="padding: 3px 6px; font-size: 10px;" onclick="App.deleteFollowup('${f.id}')">×</button>

    }

    // --- Admin Chat View ---
    function renderChat() {
      const chats = state.chats || [];
      const customers = state.data.customers || [];

      // Group chats by customer
      const custChatMap = {};
      chats.forEach(m => {
        const key = m.customerId || m.customerEmail || 'unknown';
        if (!custChatMap[key]) {
          custChatMap[key] = {
            customerId: m.customerId,
            customerEmail: m.customerEmail,
            customerName: m.customerName,
            messages: []
          };
        }
        custChatMap[key].messages.push(m);
      });

      // Ensure all customers exist in customer list
      customers.forEach(c => {
        if (!custChatMap[c.id]) {
          custChatMap[c.id] = {
            customerId: c.id,
            customerEmail: c.email,
            customerName: c.name,
            messages: []
          };
        }
      });

      let convKeys = Object.keys(custChatMap);
      if (state.chatSearch) {
        const q = state.chatSearch.toLowerCase();
        convKeys = convKeys.filter(k => {
          const c = custChatMap[k];
          return (c.customerName && c.customerName.toLowerCase().includes(q)) || (c.customerEmail && c.customerEmail.toLowerCase().includes(q));
        });
      }

      if ((!state.activeChatCustomer || !convKeys.includes(state.activeChatCustomer)) && convKeys.length > 0) {
        state.activeChatCustomer = convKeys[0];
      } else if (convKeys.length === 0) {
        state.activeChatCustomer = null;
      }

      const activeConv = (state.activeChatCustomer && custChatMap[state.activeChatCustomer]) || {
        customerId: '',
        customerEmail: '',
        customerName: 'Pelanggan',
        messages: []
      };

      // Mark messages in active conversation as read by admin
      activeConv.messages.forEach(m => {
        if (m.sender === 'customer' && !m.readByAdmin) {
          m.readByAdmin = true;
        }
      });
      saveChats(state.chats);

      return `
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div>
            <h3 style="font-size: 16px; font-weight: bold;">💬 Chat & Komunikasi Pelanggan</h3>
            <p style="font-size: 11px; color: #777;">Fitur pesan langsung untuk konsultasi bahan hijab dan status pesanan pelanggan</p>
          </div>

          <div class="chat-container">
            <!-- Sidebar: Conversation List -->
            <div class="chat-sidebar">
              <div class="chat-sidebar-header">
                <input type="text" id="chat-search" class="form-control" placeholder="Cari nama pelanggan..." oninput="App.handleChatSearch(this.value)" value="${escapeHtml(state.chatSearch || '')}" style="font-size: 12px; padding: 6px 10px;">
              </div>
              <div class="chat-user-list">
                ${convKeys.length === 0 ? `
                  <div style="padding: 20px; text-align: center; color: #888; font-size: 12px;">Tidak ada obrolan</div>
                ` : convKeys.map(k => {
                  const conv = custChatMap[k];
                  const lastMsg = conv.messages[conv.messages.length - 1];
                  const unread = conv.messages.filter(m => m.sender === 'customer' && !m.readByAdmin).length;
                  const isActive = state.activeChatCustomer === k;
                  return `
                    <div class="chat-user-item ${isActive ? 'active' : ''}" onclick="App.setActiveChatCustomer('${escapeHtml(k)}')">
                      <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong style="font-size: 12px; color: var(--charcoal);">${escapeHtml(conv.customerName || conv.customerEmail || 'Pelanggan')}</strong>
                        ${unread > 0 ? `<span class="badge badge-danger" style="font-size: 9px; padding: 1px 6px;">${unread} baru</span>` : ''}
                      </div>
                      <div style="font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;">
                        ${lastMsg ? escapeHtml(lastMsg.text) : '<em>Belum ada percakapan</em>'}
                      </div>
                      ${lastMsg ? `<span style="font-size: 9px; color: #999;">${new Date(lastMsg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Main Chat Conversation Area -->
            <div class="chat-main">
              <div class="chat-header">
                <div>
                  <div style="font-weight: bold; font-size: 14px; color: var(--charcoal);">${escapeHtml(activeConv.customerName || 'Pelanggan')}</div>
                  <div style="font-size: 11px; color: #777;">${escapeHtml(activeConv.customerEmail || '')}</div>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                  ${activeConv.customerId ? `
                    <button type="button" class="btn btn-outline" style="font-size: 11px; padding: 5px 10px;" onclick="App.viewCustomer('${activeConv.customerId}')">👤 Lihat Detail Pelanggan</button>
                  ` : ''}
                  <button type="button" class="btn btn-outline" style="font-size: 11px; padding: 5px 12px; color: #DC2626; border-color: #FECACA; background: #FEF2F2;" onclick="App.clearAdminChat('${escapeHtml(activeConv.customerId || activeConv.customerEmail || '').replace(/'/g, "\\'")}')" title="Hapus seluruh riwayat chat dengan pelanggan ini">
                    🗑️ Hapus Riwayat Chat
                  </button>
                </div>
              </div>

              <div class="chat-messages" id="admin-chat-messages">
                ${activeConv.messages.length === 0 ? `
                  <div class="empty-state" style="margin: auto; border: none; background: transparent;">
                    <div class="empty-icon">💬</div>
                    <h4 style="font-size: 14px; margin-bottom: 4px;">Mulai Percakapan</h4>
                    <p style="font-size: 12px; color: #888;">Kirim pesan pertama untuk menyapa pelanggan BY.NVDILA.</p>
                  </div>
                ` : activeConv.messages.map(m => `
                  <div class="chat-bubble ${m.sender === 'admin' ? 'chat-bubble-admin' : 'chat-bubble-customer'}">
                    <div>${escapeHtml(m.text)}</div>
                    <div class="chat-time" style="text-align: ${m.sender === 'admin' ? 'right' : 'left'};">
                      ${new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} • ${m.sender === 'admin' ? 'Saya (Admin)' : escapeHtml(activeConv.customerName)}
                    </div>
                  </div>
                `).join('')}
              </div>

              <form class="chat-footer" onsubmit="App.sendAdminChatMessage(event)">
                <input type="text" id="admin-chat-input" class="form-control" placeholder="Tulis balasan untuk ${escapeHtml(activeConv.customerName || 'pelanggan')}..." required autocomplete="off" style="flex: 1;">
                <button type="submit" class="btn btn-primary" style="padding: 0 16px; height: 38px;">Kirim 📤</button>
              </form>
            </div>
          </div>
        </div>
      `;
    }

        `;
      }

      // 1. Purchase Checkout Modal (Customer Portal)
      if (state.activeModal === 'purchase') {
        const p = state.modalPayload || {};
        const colorList = getProductColors(p);
        const defaultColor = colorList.length > 0 ? colorList[0] : '';
        const currentCust = (state.data.customers || []).find(c => (state.auth && state.auth.customerId && c.id === state.auth.customerId) || (state.auth && state.auth.email && c.email && c.email.toLowerCase() === state.auth.email.toLowerCase()));
        const defaultAddress = (state.auth && state.auth.address) || (currentCust && currentCust.address) || '';
        return `
          <div class="modal-overlay" onclick="if(event.target === this) App.closeModal();">
            <div class="modal-card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h3 style="font-size: 16px; font-weight: bold;">Checkout Hijab BY.NVDILA</h3>
                <button type="button" class="btn btn-outline" onclick="App.closeModal()" style="padding: 4px 8px; font-size: 12px; border-radius: 8px;">✕</button>
              </div>

              <div style="margin-bottom: 16px; padding: 12px; background: #FAF8F5; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 12px; align-items: center;">
                <div style="width: 60px; height: 60px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #F4EFEB; display: flex; align-items: center; justify-content: center;">
                  ${p.image ? `<img src="${escapeHtml(p.image)}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src=''; this.parentElement.innerHTML='<span style=\\'font-size:24px;\\'>🧕</span>';">` : `<span style="font-size: 24px;">🧕</span>`}
                </div>
                <div style="flex: 1;">
                  <div style="font-weight: bold; font-size: 14px;">${escapeHtml(p.name)}</div>
                  <div style="font-size: 11px; color: #777;">${escapeHtml(p.category)} • Stok: ${p.stock} pcs</div>
                  <div style="font-size: 15px; font-weight: bold; color: var(--mocha); margin-top: 4px;">${formatRupiah(p.price)}</div>
                </div>
              </div>

              <form onsubmit="App.submitPurchase(event)">
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Pilihan Warna Hijab ${colorList.length > 0 ? `<span style="font-size: 10px; color: #888; font-weight: normal; text-transform: none;">(Tersedia: ${escapeHtml(colorList.join(', '))})</span>` : ''}</label>
                    <input type="text" id="buy-color" class="form-control" value="${escapeHtml(defaultColor)}" required placeholder="Pilih atau ketik varian warna">
                    ${colorList.length > 0 ? `
                      <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;">
                        ${colorList.map(col => `
                          <button type="button" class="btn btn-secondary" style="font-size: 10.5px; padding: 3px 8px; border-radius: 6px;" data-color="${escapeHtml(col)}" onclick="App.selectPurchaseColor(this.getAttribute('data-color'))">${escapeHtml(col)}</button>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                  <div class="form-group">
                    <label class="form-label">Jumlah Pembelian (Qty)</label>
                    <input type="number" id="buy-qty" class="form-control" value="1" min="1" max="${p.stock || 10}" required>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Alamat Pengiriman Lengkap <span style="color: #DC2626; font-weight: bold;">*(Wajib Diisi)</span></label>
                  <textarea id="buy-address" class="form-control" rows="2" required placeholder="Wajib diisi: Masukkan alamat pengiriman lengkap Anda (Jalan, No Rumah, Kota, Kode Pos)">${escapeHtml(defaultAddress)}</textarea>
                </div>

                <div class="form-group">
                  <label class="form-label">Pilihan Metode Pembayaran</label>
                  <select id="buy-payment-method" class="form-control">
                    <option value="Transfer Bank (BCA)">Transfer Bank (BCA)</option>
                    <option value="Transfer Bank (Mandiri)">Transfer Bank (Mandiri)</option>
                    <option value="Transfer Bank (BRI)">Transfer Bank (BRI)</option>
                    <option value="Transfer Bank (BNI)">Transfer Bank (BNI)</option>
                    <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat / Cash on Delivery)</option>
                  </select>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
                  <button type="button" class="btn btn-outline" onclick="App.closeModal()">← Kembali</button>
                  <button type="submit" class="btn btn-primary">Konfirmasi & Bayar Sekarang</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // 2. Customer Modal (Add & Edit)
      if (state.activeModal === 'customer') {
        const c = state.modalPayload || {};
        return `
          <div class="modal-overlay" onclick="if(event.target === this) App.closeModal();">
            <div class="modal-card">
              <h3 style="font-size: 16px; font-weight: bold; margin-bottom: 16px;">${c.id ? 'Edit Pelanggan' : 'Tambah Pelanggan Baru'}</h3>
              <form onsubmit="App.saveCustomer(event)">
                <div class="form-group">
                  <label class="form-label">Nama Lengkap</label>
                  <input id="f-cust-name" class="form-control" required value="${escapeHtml(c.name || '')}" placeholder="Nama Lengkap">
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Nomor WhatsApp</label>
                    <input id="f-cust-phone" class="form-control" required value="${escapeHtml(c.phone || '')}" placeholder="081234567890">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Email</label>
                    <input id="f-cust-email" class="form-control" type="email" value="${escapeHtml(c.email || '')}" placeholder="nama@email.com">
                  </div>
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Tanggal Bergabung</label>
                    <input id="f-cust-date" type="date" class="form-control" required value="${escapeHtml(c.joinDate || new Date().toISOString().slice(0, 10))}">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Segmentasi</label>
                    <select id="f-cust-seg" class="form-control">
                      <option value="New Customer" ${c.segment === 'New Customer' ? 'selected' : ''}>New Customer</option>
                      <option value="Regular Customer" ${c.segment === 'Regular Customer' ? 'selected' : ''}>Regular Customer</option>
                      <option value="Loyal Customer" ${c.segment === 'Loyal Customer' ? 'selected' : ''}>Loyal Customer</option>
                      <option value="VIP Customer" ${c.segment === 'VIP Customer' ? 'selected' : ''}>VIP Customer</option>
                      <option value="Inactive Customer" ${c.segment === 'Inactive Customer' ? 'selected' : ''}>Inactive Customer</option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Alamat Pengiriman</label>
                  <textarea id="f-cust-addr" class="form-control" rows="2">${escapeHtml(c.address || '')}</textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Catatan</label>
                  <input id="f-cust-notes" class="form-control" value="${escapeHtml(c.notes || '')}" placeholder="Preferensi warna...">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                  <button type="button" class="btn btn-outline" onclick="App.closeModal()">← Batal</button>
                  <button type="submit" class="btn btn-primary">Simpan Pelanggan</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // 3. Product Modal (Add & Edit)
      if (state.activeModal === 'product') {
        const p = state.modalPayload || {};
        const currentImg = state.tempProductImage !== undefined ? state.tempProductImage : (p.image || '');
        return `
          <div class="modal-overlay" onclick="if(event.target === this) App.closeModal();">
            <div class="modal-card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 16px; font-weight: bold;">${p.id ? 'Edit Produk Hijab' : 'Tambah Produk Hijab Baru'}</h3>
                <button type="button" class="btn btn-outline" onclick="App.closeModal()" style="padding: 4px 8px; font-size: 12px; border-radius: 8px;">✕</button>
              </div>
              <form onsubmit="App.saveProduct(event)">
                <div class="form-group">
                  <label class="form-label">Foto Produk Hijab</label>
                  <div style="display: flex; gap: 14px; align-items: flex-start;">
                    <div id="prod-img-preview-box" style="width: 84px; height: 84px; border-radius: 12px; overflow: hidden; background: #F4EFEB; border: 1px dashed #D8CBBF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                      ${currentImg ? `<img id="prod-img-preview" src="${escapeHtml(currentImg)}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src=''; this.parentElement.innerHTML='<span style=\\'font-size:26px;\\'>🧕</span>';">` : `<span id="prod-img-preview-placeholder" style="font-size: 26px;">🧕</span>`}
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                        <label class="btn btn-outline" style="font-size: 11px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                          📁 Pilih File Foto Produk
                          <input type="file" id="f-prod-image-file" accept="image/*" style="display: none;" onchange="App.handleProductImageUpload(event)">
                        </label>
                        <button type="button" class="btn btn-outline" style="font-size: 11px; padding: 7px 10px; color: #DC2626;" onclick="App.clearProductImage()">Hapus Foto</button>
                      </div>
                      <span style="font-size: 10px; color: #888;">Unggah file gambar dari komputer atau galeri ponsel Anda (JPG, PNG, WebP). URL foto ditiadakan.</span>
                    </div>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Nama Produk Hijab</label>
                  <input id="f-prod-name" class="form-control" required value="${escapeHtml(p.name || '')}" placeholder="Pashmina Viscose Modal Premium">
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Kategori</label>
                    <select id="f-prod-cat" class="form-control">
                      <option value="Pashmina Viscose Modal" ${p.category === 'Pashmina Viscose Modal' ? 'selected' : ''}>Pashmina Viscose Modal</option>
                      <option value="Hijab Instan/Tali" ${p.category === 'Hijab Instan/Tali' ? 'selected' : ''}>Hijab Instan/Tali</option>
                      <option value="Bergo Instan Praktis" ${p.category === 'Bergo Instan Praktis' ? 'selected' : ''}>Bergo Instan Praktis</option>
                      <option value="Inner/Ciput" ${p.category === 'Inner/Ciput' ? 'selected' : ''}>Inner/Ciput</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Varian Warna</label>
                    <input id="f-prod-color" class="form-control" value="${escapeHtml(p.color || '')}" placeholder="Espresso, Mauve, Sage">
                  </div>
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Harga (Rp)</label>
                    <input id="f-prod-price" type="number" class="form-control" required value="${p.price !== undefined ? p.price : ''}" placeholder="Harga (Rp)">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Stok</label>
                    <input id="f-prod-stock" type="number" class="form-control" required value="${p.stock !== undefined ? p.stock : ''}" placeholder="Jumlah Stok">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Deskripsi Bahan & Jahitan</label>
                  <textarea id="f-prod-desc" class="form-control" rows="2" placeholder="Bahan viscose modal premium lembut, flowy, adem...">${escapeHtml(p.description || '')}</textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                  <button type="button" class="btn btn-outline" onclick="App.closeModal()">← Batal</button>
                  <button type="submit" class="btn btn-primary">Simpan Produk</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // 4. Order Modal (Add New Order)
      if (state.activeModal === 'order') {
        const ord = state.modalPayload || {};
        const defaultCustName = ord.customerName || ((state.data.customers && state.data.customers[0]) ? state.data.customers[0].name : '');
        const defaultProdName = (state.data.products && state.data.products[0]) ? state.data.products[0].name : '';
        const defaultTotal = (state.data.products && state.data.products[0]) ? state.data.products[0].price : '';
        return `
          <div class="modal-overlay" onclick="if(event.target === this) App.closeModal();">
            <div class="modal-card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 16px; font-weight: bold;">Input Pesanan Baru</h3>
                <button type="button" class="btn btn-outline" onclick="App.closeModal()" style="padding: 4px 8px; font-size: 12px; border-radius: 8px;">✕</button>
              </div>
              <form onsubmit="App.saveOrder(event)">
                <div class="form-group">
                  <label class="form-label">Nama Pelanggan</label>
                  <input id="f-ord-cust" class="form-control" required value="${escapeHtml(defaultCustName)}" placeholder="Nama Pelanggan">
                </div>
                <div class="form-group">
                  <label class="form-label">Produk Hijab yang Dibeli</label>
                  <input id="f-ord-prod" class="form-control" required value="${escapeHtml(defaultProdName)}" placeholder="Pashmina Viscose / Bergo Instan">
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Jumlah (Qty)</label>
                    <input id="f-ord-qty" type="number" min="1" class="form-control" required value="1">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Total Pembayaran (Rp)</label>
                    <input id="f-ord-total" type="number" class="form-control" required value="${defaultTotal}" placeholder="Total Pembayaran (Rp)">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Alamat Pengiriman Pelanggan</label>
                  <textarea id="f-ord-address" class="form-control" rows="2" placeholder="Jl. Anggrek No. 10, RT 02/RW 05, Menteng, Jakarta Pusat, 10310">${escapeHtml(ord.shippingAddress || '')}</textarea>
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Metode Pembayaran</label>
                    <select id="f-ord-paymethod" class="form-control">
                      <option value="Transfer Bank (BCA)">Transfer Bank (BCA)</option>
                      <option value="Transfer Bank (Mandiri)">Transfer Bank (Mandiri)</option>
                      <option value="Transfer Bank (BRI)">Transfer Bank (BRI)</option>
                      <option value="Transfer Bank (BNI)">Transfer Bank (BNI)</option>
                      <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
                    </select>
                  </div>
                  
                  <div class="form-group">
                    <label class="form-label">Status Pesanan</label>
                    <select id="f-ord-status" class="form-control">
                      <option value="Completed">Completed (Selesai)</option>
                      <option value="Processing">Processing (Diproses)</option>
                      <option value="Shipped">Shipped (Dikirim)</option>
                    </select>
                  </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                  <button type="button" class="btn btn-outline" onclick="App.closeModal()">← Batal</button>
                  <button type="submit" class="btn btn-primary">Simpan Pesanan</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // 5. Follow-up Modal
      if (state.activeModal === 'followup') {
        return `
          <div class="modal-overlay" onclick="if(event.target === this) App.closeModal();">
            <div class="modal-card">
              <h3 style="font-size: 16px; font-weight: bold; margin-bottom: 16px;">Buat Jadwal Follow-up</h3>
              <form onsubmit="App.saveFollowup(event)">
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Nama Pelanggan</label>
                    <input id="f-flw-cust" class="form-control" required placeholder="Nama Pelanggan">
                  </div>
                  <div class="form-group">
                    <label class="form-label">No WhatsApp</label>
                    <input id="f-flw-phone" class="form-control" required placeholder="081234567890">
                  </div>
                </div>
                <div class="grid grid-2">
                  <div class="form-group">
                    <label class="form-label">Kategori</label>
                    <select id="f-flw-cat" class="form-control">
                      <option value="New Customer">New Customer</option>
                      <option value="Repeat Purchase">Repeat Purchase</option>
                      <option value="Inactive Customer">Inactive Customer</option>
                      <option value="Product Recommendation">Product Recommendation</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Jadwal Tanggal</label>
                    <input id="f-flw-date" type="date" class="form-control" required value="${new Date().toISOString().slice(0, 10)}">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Pesan Catatan</label>
                  <textarea id="f-flw-notes" class="form-control" rows="2">Halo kak dari BY.NVDILA! Terima kasih sudah berbelanja hijab. Bagaimana kesan pemakaian bahannya kak? ✨</textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                  <button type="button" class="btn btn-outline" onclick="App.closeModal()">← Batal</button>
                  <button type="submit" class="btn btn-primary">Simpan Follow-up</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      return '';
    }

    // Initialize application on load
    window.onload = function() { render(); if (typeof App !== 'undefined' && App.initCloudSync) App.initCloudSync(); };
    render();
    if (typeof App !== 'undefined' && App.initCloudSync) App.initCloudSync();
  </script>
</body>
</html>
